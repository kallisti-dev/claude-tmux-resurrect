name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match the tag to the manifest version and main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match version $version in .claude-plugin/plugin.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse "refs/tags/$TAG^{commit}")" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi

  checks:
    needs: verify
    uses: ./.github/workflows/check.yml

  release:
    name: Publish the release
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
